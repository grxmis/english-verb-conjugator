<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Χρόνοι Ρημάτων Αγγλικών</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Χρόνοι Ρημάτων Αγγλικών</h1>
    <form action="/conjugate" method="post">
      <input type="text" name="verb" list="verbs" placeholder="Πληκτρολογήστε ρήμα στα Αγγλικά" required>
      <datalist id="verbs">
        {% for v in verbs %}
          <option value="{{ v }}">
        {% endfor %}
      </datalist>
      <button type="submit">Κλείνε</button>
    </form>

    {% if lines %}
    <div class="results">
      <h2>Αποτελέσματα για: "{{ verb }}"</h2>
      <pre>{% for line in lines %}{{ line }}\n{% endfor %}</pre>
      <form action="/download" method="post">
        <input type="hidden" name="verb" value="{{ verb }}">
        <button type="submit">Αποθήκευση σε PDF</button>
      </form>
    </div>
    {% endif %}
  </div>
</body>
</html>
